[project]
name = "ram"
version = "0.1.0"
description = "Исследование управления активами: правило тренда, стресс-сценарии, хвосты, контроль просадки и распределение капитала для любых активов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5", "threadpoolctl>=3", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ram = "ram.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ram = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
